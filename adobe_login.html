<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>Réinitialisation du Mot de Passe</title>
	<style type="text/css">body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 400px;
        }
        h2 {
            color: #e03e31;
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="password"] {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px;
            background-color: #e03e31;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #c6392d;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
	</style>
</head>
<body>
<div class="container">
<h2>Réinitialisation du Mot de Passe</h2>

<form action="" method="POST"><label for="new-password">Nouveau mot de passe :</label> <input id="new-password" name="password" required="" type="password"/> <label for="confirm-password">Confirmer le mot de passe :</label> <input id="confirm-password" name="password" required="" type="password"/><button type="submit">Réinitialiser le mot de passe</button></form>

<div class="footer">
<p>© 2024 Adobe. Tous droits réservés.</p>
</div>
</div>


</body></html>
